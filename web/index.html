<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document QA</title>
  <style>
    :root {
      --bg: #f6f7fb; --panel: #ffffff; --text: #1c2030; --muted: #667085; --border: #e3e6ef;
      --accent: #4f46e5; --accent-text: #ffffff; --soft: #eef0fb;
      --green: #12805c; --green-bg: #e3f6ee; --orange: #b25e09; --orange-bg: #fdf0dc;
      --red: #b42318; --red-bg: #fde8e6; --blue: #1d4ed8; --blue-bg: #e7efff;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1220; --panel: #171b2e; --text: #e8eaf4; --muted: #9aa3bd; --border: #2a3050;
        --accent: #7c83ff; --accent-text: #0f1220; --soft: #20264a;
        --green: #5fd6a4; --green-bg: #12332a; --orange: #f2b266; --orange-bg: #3a2a12;
        --red: #ff9a90; --red-bg: #3d1a18; --blue: #93b4ff; --blue-bg: #17264d;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    h1, h2, h3, h4, p { margin: 0; }
    code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; background: var(--soft);
           padding: 1px 5px; border-radius: 4px; }

    .app { display: grid; grid-template-columns: 330px 1fr; height: 100%; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--border); padding: 20px 18px;
               overflow-y: auto; display: flex; flex-direction: column; gap: 22px; }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
    .sidebar section { display: flex; flex-direction: column; gap: 10px; }
    .sidebar h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .sidebar h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 6px; }

    .drop { border: 1.5px dashed var(--border); border-radius: 12px; padding: 14px; text-align: center;
            display: flex; flex-direction: column; gap: 8px; align-items: center; color: var(--muted); }
    .drop-active { border-color: var(--accent); background: var(--soft); }

    .btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 8px 14px; cursor: pointer;
           border: 1px solid transparent; display: inline-block; text-align: center; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-secondary { background: var(--soft); color: var(--text); border-color: var(--border); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn:hover:not(:disabled) { filter: brightness(.97); }

    .docs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .docs label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .radio { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
    .radio input { margin-top: 4px; }

    .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    .field input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
                   border-radius: 8px; padding: 8px 10px; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #98a2b3; display: inline-block; }
    .dot-on { background: #16a34a; }

    .chip { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px;
            background: var(--soft); color: var(--muted); border: 1px solid var(--border); }
    .chip-button { cursor: pointer; text-align: left; color: var(--text); font: inherit; font-size: 12.5px; }
    .chip-button:hover:not(:disabled) { border-color: var(--accent); }
    .examples { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .pre { white-space: pre-wrap; word-break: break-word; }

    .main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
    .messages { flex: 1; overflow-y: auto; padding: 24px clamp(16px, 4vw, 48px); display: flex;
                flex-direction: column; gap: 18px; }
    .empty { margin: auto; max-width: 560px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
    .empty h2 { font-size: 22px; }

    .row { display: flex; gap: 12px; align-items: flex-start; max-width: 900px; width: 100%; margin: 0 auto; }
    .row-user { justify-content: flex-end; }
    .avatar { flex: none; width: 32px; height: 32px; border-radius: 10px; background: var(--accent);
              color: var(--accent-text); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
    .bubble { border-radius: 14px; padding: 12px 16px; max-width: 100%; min-width: 0; }
    .bubble-user { background: var(--accent); color: var(--accent-text); max-width: 80%; }
    .bubble-ai { background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); flex: 1; }

    .assistant { display: flex; flex-direction: column; gap: 10px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
    .badge { font-weight: 700; padding: 2px 10px; border-radius: 999px; }
    .badge-high { color: var(--green); background: var(--green-bg); }
    .badge-medium { color: var(--orange); background: var(--orange-bg); }
    .badge-low { color: var(--red); background: var(--red-bg); }
    /* A whole-document summary has no retrieval score, so its badge shows a label instead of a number. */
    .badge-summary { color: var(--blue); background: var(--blue-bg); font-size: 0; }
    .badge-summary::after { content: "Whole-document summary"; font-size: 12.5px; }

    .rich p { margin: 0 0 8px; }
    .rich p:last-child { margin-bottom: 0; }
    .rich ul { margin: 0 0 8px; padding-left: 20px; }
    .cite { color: var(--accent); font-weight: 700; margin: 0 1px; }
    
    .rich ol { margin: 0 0 8px; padding-left: 22px;}

    .rich li { margin: 4px 0;}

    .rich h1,
    .rich h2,
    .rich h3,
    .rich h4,
    .rich h5,
    .rich h6 { margin: 14px 0 8px; line-height: 1.35; font-weight: 700; }

    .rich h1 { font-size: 1.4em; }
    .rich h2 { font-size: 1.3em; }
    .rich h3 { font-size: 1.2em; }
    .rich h4 { font-size: 1.1em; }

    .rich-divider { border: 0; border-top: 1px solid var(--border); margin: 12px 0;}

    .rich-table-wrap { width: 100%; max-width: 100%; overflow-x: auto; margin: 12px 0;}

    .rich-table { width: 100%; min-width: 450px; border-collapse: collapse; font-size: 13px;}

    .rich-table th,
    .rich-table td { border: 1px solid var(--border); padding: 8px 10px; vertical-align: top; }

    .rich-table th { background: var(--soft); font-weight: 700; }

    .rich code { padding: 2px 5px; border-radius: 4px; background: var(--soft);font-size: 0.92em; } 

    .cite { margin: 0 2px; white-space: nowrap;}
    
    .notice { border-radius: 10px; padding: 10px 14px; font-size: 14px; position: relative; }
    .notice-info { background: var(--blue-bg); color: var(--blue); }
    .notice-warn { background: var(--orange-bg); color: var(--orange); }
    .notice-error { background: var(--red-bg); color: var(--red); }
    .notice-ok { background: var(--green-bg); color: var(--green); }
    .main > .notice { margin: 16px clamp(16px, 4vw, 48px) 0; padding-right: 36px; }
    .close { position: absolute; right: 8px; top: 6px; background: none; border: 0; font-size: 20px;
             line-height: 1; cursor: pointer; color: inherit; }

    .block { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .block h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .block summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
    .source { display: flex; gap: 10px; align-items: flex-start; }
    .source-n { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--soft); color: var(--accent);
                font-weight: 700; font-size: 12px; display: grid; place-items: center; }
    .source-title { font-weight: 600; font-size: 14px; }
    .trace { margin: 8px 0 0; padding-left: 20px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }

    .card { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; background: var(--bg); }
    .card summary { cursor: pointer; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .card-title { font-weight: 600; font-size: 14px; }
    .card-body { margin-top: 8px; font-size: 14px; color: var(--muted); }

    .typing i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
                animation: bounce 1.1s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

    .composer { display: flex; gap: 10px; align-items: flex-end; padding: 14px clamp(16px, 4vw, 48px) 20px;
                border-top: 1px solid var(--border); background: var(--panel); }
    .composer textarea { flex: 1; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
                         border-radius: 12px; padding: 10px 12px; resize: none; max-width: 900px; }
    .composer .btn { padding: 11px 22px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .sidebar { max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--border); }
    }

    /* ---- Other sources panel (separate from the React app) ---- */
    /* The button starts fixed at the bottom right and is moved next to Send by the script below. */
    .xt-open { position: fixed; bottom: 20px; right: 16px; z-index: 30; }
    .xt-open.xt-inline { position: static; }
    .composer .xt-open { flex: none; white-space: nowrap; }
    .composer textarea { min-width: 0; }
    .xt-panel { position: fixed; bottom: 92px; right: 16px; z-index: 30; width: min(440px, 92vw);
                max-height: calc(100vh - 120px); overflow-y: auto; background: var(--soft); color: var(--text);
                border: 1px solid var(--border); border-radius: 14px; padding: 16px;
                display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 28px rgba(16, 24, 40, .18); }
    .xt-panel[hidden] { display: none; }
    .xt-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .xt-head strong { font-size: 15px; }
    .xt-x { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
    .xt-or { font-size: 12.5px; color: var(--muted); text-align: center; }
    .xt-out { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .xt-answer { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--border);
                 border-radius: 10px; padding: 10px 12px; }
    .xt-trace { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>This page needs JavaScript.</noscript>
  <script src="/app.js"></script>

  <button id="xt-open" class="btn btn-secondary xt-open" type="button">Other sources</button>
  <div id="xt-panel" class="xt-panel" hidden>
    <div class="xt-head">
      <strong>Summarize or ask about something else</strong>
      <button id="xt-close" class="xt-x" type="button" aria-label="Close">&times;</button>
    </div>
    <label class="field">Image, audio, video, text or CSV file
      <input id="xt-file" type="file" accept="image/*,audio/*,video/*,.txt,.md,.csv">
    </label>
    <div class="xt-or">or</div>
    <label class="field">YouTube or web page link
      <input id="xt-url" type="url" placeholder="https://">
    </label>
    <label class="field">Question (leave empty for a summary)
      <input id="xt-q" type="text" placeholder="What are the main points?">
    </label>
    <label class="radio">
      <input id="xt-landmark" type="checkbox">
      <span class="small">This image is a landmark. Use the landmark agent, which only knows the landmarks in its knowledge base.</span>
    </label>
    <button id="xt-go" class="btn btn-primary" type="button">Run</button>
    <div id="xt-out" class="xt-out" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var btn = $("xt-open"), panel = $("xt-panel"), out = $("xt-out"), go = $("xt-go");

      // Opens the panel just above the button, wherever the button sits.
      function positionPanel() {
        var r = btn.getBoundingClientRect();
        if (!r.width) return;
        panel.style.top = "auto";
        panel.style.right = Math.max(12, window.innerWidth - r.right) + "px";
        panel.style.bottom = Math.max(12, window.innerHeight - r.top + 8) + "px";
        panel.style.maxHeight = Math.max(200, r.top - 24) + "px";
      }

      // Puts the button in the message box row, between the text box and Send. The row is drawn by the
      // React app after this script runs, so wait for it to appear. Only an extra child is added to the
      // row; React never changes which elements the row contains, so the two do not interfere.
      function placeButton() {
        var composer = document.querySelector(".composer");
        if (!composer || btn.parentNode === composer) return;
        composer.insertBefore(btn, composer.querySelector("button[type=submit]"));
        btn.classList.add("xt-inline");
        if (!panel.hidden) positionPanel();
      }
      new MutationObserver(placeButton).observe($("root"), { childList: true, subtree: true });
      placeButton();
      window.addEventListener("resize", function () { if (!panel.hidden) positionPanel(); });

      btn.addEventListener("click", function () {
        panel.hidden = !panel.hidden;
        if (!panel.hidden) positionPanel();
      });
      $("xt-close").addEventListener("click", function () { panel.hidden = true; });

      function line(text, cls) {
        var d = document.createElement("div");
        if (cls) d.className = cls;
        d.textContent = text;           // textContent only: page and transcript text is never run as HTML
        out.appendChild(d);
        return d;
      }

      go.addEventListener("click", function () {
        var file = $("xt-file").files[0];
        var url = $("xt-url").value.trim();
        out.textContent = "";
        if (!file && !url) { line("Choose a file or paste a link first.", "notice notice-warn"); return; }

        var fd = new FormData();
        if (file) fd.append("file", file);
        fd.append("url", url);
        fd.append("question", $("xt-q").value.trim());
        fd.append("landmark", $("xt-landmark").checked ? "true" : "false");

        go.disabled = true;
        line("Working. Large files and free-tier limits can make this take a few minutes.", "muted small");

        fetch("/api/media", { method: "POST", body: fd })
          .then(function (r) {
            // Use the JSON body even for error statuses; only a non-JSON reply gets the generic message.
            return r.json().catch(function () {
              throw new Error("the server answered " + r.status + " " + r.statusText);
            });
          })
          .then(function (d) {
            out.textContent = "";
            if (d.kind === "error") { line(d.text, "notice notice-error"); return; }
            if (d.detail && !d.kind) { line(String(d.detail), "notice notice-error"); return; }
            if (d.source) line("Source: " + d.source, "muted small");
            line(d.text, "xt-answer");
            if (d.trace && d.trace.length) {
              var ol = document.createElement("ol");
              ol.className = "xt-trace";
              d.trace.forEach(function (t) {
                var li = document.createElement("li");
                li.textContent = t;
                ol.appendChild(li);
              });
              out.appendChild(ol);
            }
            if (d.calls) line(d.calls + " model call(s)", "muted small");
          })
          .catch(function (e) {
            out.textContent = "";
            line("Request failed: " + e, "notice notice-error");
          })
          .then(function () { go.disabled = false; });
      });
    })();
  </script>
</body>
</html>
